allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260730.0-alpha
  - wrangler@4.118.0
  - '@types/node@24.13.3'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
