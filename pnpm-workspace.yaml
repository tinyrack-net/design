packages:
  - packages/*

linkWorkspacePackages: true

overrides:
  '@types/node': 26.5.0
  sharp: 0.35.4

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260907.0-alpha
  - wrangler@4.129.1
  - '@types/node@26.5.0'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
