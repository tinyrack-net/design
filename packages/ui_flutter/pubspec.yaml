name: tinyrack_ui
description: Cross-platform Flutter components and design tokens for Tinyrack applications.
version: 0.68.0
homepage: https://design.tinyrack.net/en/flutter/
repository: https://github.com/tinyrack-net/design/tree/main/packages/ui_flutter
issue_tracker: https://github.com/tinyrack-net/design/issues
topics:
  - design-system
  - flutter
  - material
  - theme

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  analyzer: ">=12.1.0 <14.0.0"
  flutter:
    sdk: flutter
  intl: ^0.20.2
  lucide_flutter: ^1.28.0
  material_ui: ^1.0.0
  qr: ^3.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  cupertino_ui: ^1.0.0

flutter:
  # The desktop halves of TRNativeContextMenuPresenter, which hand a described
  # TRContextMenu to GTK, Win32, and AppKit. There is no mobile or web entry,
  # so those platforms keep the Flutter presentation and build nothing.
  plugin:
    platforms:
      linux:
        pluginClass: TinyrackUiPlugin
      macos:
        pluginClass: TinyrackUiPlugin
      windows:
        pluginClass: TinyrackUiPluginCApi

  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.otf
          weight: 700
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexSansKR-SemiBold.otf
          weight: 600
        - asset: assets/fonts/IBMPlexSansKR-Bold.otf
          weight: 700
    - family: IBMPlexSansJP
      fonts:
        - asset: assets/fonts/IBMPlexSansJP-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexSansJP-SemiBold.otf
          weight: 600
        - asset: assets/fonts/IBMPlexSansJP-Bold.otf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.otf
          weight: 500
