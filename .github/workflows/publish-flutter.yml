name: Publish Flutter package

on:
  push:
    tags:
      - "tinyrack_ui-v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pub-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tinyrack_ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Verify tag matches package version
        working-directory: packages/ui_flutter
        shell: bash
        run: |
          package_version="$(sed -n 's/^version: *//p' pubspec.yaml | head -1)"
          if [ -z "$package_version" ]; then
            echo "::error::Could not read version from packages/ui_flutter/pubspec.yaml"
            exit 1
          fi
          if [ "tinyrack_ui-v$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version tinyrack_ui-v$package_version"
            exit 1
          fi

      - name: Verify Flutter package
        uses: ./.github/actions/verify-flutter-package

  publish:
    name: Publish tinyrack_ui
    needs: verify
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
      working-directory: packages/ui_flutter
