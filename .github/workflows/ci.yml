name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: Plan CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      docs_contract: ${{ steps.plan.outputs.docs_contract }}
      flutter: ${{ steps.plan.outputs.flutter }}
      flutter_preview: ${{ steps.plan.outputs.flutter_preview }}
      homepage: ${{ steps.plan.outputs.homepage }}
      shared: ${{ steps.plan.outputs.shared }}
      ui: ${{ steps.plan.outputs.ui }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          # Every job waits on this one, so its clone sits at the head of the
          # run. The full commit graph is still needed to diff against the
          # base, but the blobs are not: the filter defers them until `git
          # diff` actually reads a changed file.
          fetch-depth: 0
          filter: blob:none

      - name: Check patch formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi

      - name: Classify affected packages
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/ci-change-plan.ts --base "$BASE_SHA" --head "$HEAD_SHA"

  web_packages:
    name: Build Web packages
    if: >-
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Build Web packages
          phase: start

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install Web package dependencies
        run: pnpm --filter @tinyrack/docs... install --frozen-lockfile

      - name: Build UI and Docs packages
        run: |
          pnpm --filter @tinyrack/ui build
          pnpm --filter @tinyrack/docs build

      - name: Pack prepared UI dependency
        run: |
          mkdir -p .tmp/prebuilt
          pnpm --config.ignore-scripts=true --dir packages/ui_web pack --pack-destination "$GITHUB_WORKSPACE/.tmp/prebuilt"

      - name: Upload Homepage runtime inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-docs-runtime
          path: |
            packages/ui_web/dist
            packages/docs/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload Docs smoke inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-smoke-input
          path: |
            .tmp/prebuilt
            packages/docs/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Build Web packages
          phase: finish

  homepage_preview:
    name: Build Homepage Flutter preview
    if: >-
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Build Homepage Flutter preview
          phase: start

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check generated design tokens
        run: pnpm run tokens:check

      - name: Build Flutter preview
        run: pnpm run flutter:preview:build

      - name: Upload Flutter preview runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: flutter-preview-runtime
          path: packages/ui_flutter/example/build/web
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Build Homepage Flutter preview
          phase: finish

  ui:
    name: UI Chromium and contracts
    if: >-
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: UI Chromium and contracts
          phase: start

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install UI dependencies
        run: pnpm --filter @tinyrack/ui... install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter @tinyrack/ui build

      - name: Set up Chromium
        uses: ./.github/actions/setup-playwright
        with:
          filter: "@tinyrack/ui"
          browsers: chromium

      - name: Test UI unit, documentation contract, and Chromium suites
        run: |
          pnpm --filter @tinyrack/ui test:unit
          pnpm --filter @tinyrack/ui test:docs-contract
          pnpm --filter @tinyrack/ui test:chromium

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: UI Chromium and contracts
          phase: finish

  ui_firefox:
    name: UI Firefox
    if: >-
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: UI Firefox
          phase: start

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install UI dependencies
        run: pnpm --filter @tinyrack/ui... install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter @tinyrack/ui build

      - name: Set up Firefox
        uses: ./.github/actions/setup-playwright
        with:
          filter: "@tinyrack/ui"
          browsers: firefox

      - name: Test UI Firefox suite
        id: ui-firefox-test
        continue-on-error: true
        run: pnpm --filter @tinyrack/ui test:firefox

      - name: Retry UI Firefox suite for diagnostics
        if: steps.ui-firefox-test.outcome == 'failure'
        run: pnpm --filter @tinyrack/ui test:firefox

      - name: Preserve the first UI Firefox failure
        if: steps.ui-firefox-test.outcome == 'failure'
        run: exit 1

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: UI Firefox
          phase: finish

  docs_contract:
    name: UI documentation contracts
    if: >-
      needs.changes.outputs.docs_contract == 'true' &&
      needs.changes.outputs.ui != 'true' &&
      needs.changes.outputs.shared != 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: UI documentation contracts
          phase: start

      - name: Install UI contract dependencies
        run: pnpm --filter @tinyrack/ui... install --frozen-lockfile

      - name: Test UI documentation contracts
        run: pnpm --filter @tinyrack/ui test:docs-contract

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: UI documentation contracts
          phase: finish

  docs:
    name: Docs package
    if: >-
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs:
      - changes
      - web_packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Docs package
          phase: start

      - name: Install Docs dependencies
        run: pnpm --filter @tinyrack/docs... install --frozen-lockfile

      - name: Download Docs smoke inputs
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-smoke-input
          path: .

      - name: Test Docs package
        run: |
          export TINYRACK_UI_TARBALL="$(realpath .tmp/prebuilt/*.tgz)"
          tar -xzf "$TINYRACK_UI_TARBALL" -C packages/ui_web --strip-components=1 package/dist
          pnpm --filter @tinyrack/docs test:prepared

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Docs package
          phase: finish

  homepage:
    name: Homepage package
    if: >-
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs:
      - changes
      - homepage_preview
      - web_packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Homepage package
          phase: start

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install Homepage and quality dependencies
        run: >-
          pnpm
          --filter tinyrack-ui-workspace
          --filter @tinyrack/homepage...
          install --frozen-lockfile

      - name: Check workspace quality
        run: |
          pnpm run biome
          pnpm run scripts:check
          pnpm run ci:plan:test
          pnpm run tokens:audit
          pnpm run flutter:preview:check

      - name: Download Web package runtime
        uses: actions/download-artifact@v8.0.1
        with:
          name: ui-docs-runtime
          path: packages

      - name: Download Flutter preview runtime
        uses: actions/download-artifact@v8.0.1
        with:
          name: flutter-preview-runtime
          path: packages/ui_flutter/example/build/web

      - name: Build Homepage
        run: |
          pnpm --filter @tinyrack/homepage build
          pnpm run flutter:preview:budget

      - name: Set up Chromium
        uses: ./.github/actions/setup-playwright
        with:
          filter: "@tinyrack/homepage"
          browsers: chromium

      - name: Test Homepage package
        run: pnpm --filter @tinyrack/homepage test:prepared

      - name: Upload Homepage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: homepage-client
          path: packages/homepage/build/client
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Homepage package
          phase: finish

  flutter:
    name: Flutter package
    if: >-
      needs.changes.outputs.flutter == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Flutter package
          phase: start

      - name: Verify Flutter package
        uses: ./.github/actions/verify-flutter-package

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Flutter package
          phase: finish

  flutter_platforms:
    name: Flutter example (${{ matrix.target }})
    if: >-
      needs.changes.outputs.flutter == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: android
            command: flutter build apk --debug
          - runner: ubuntu-latest
            target: linux
            command: flutter build linux --debug
          - runner: macos-latest
            target: ios
            command: flutter build ios --simulator --no-codesign
          - runner: macos-latest
            target: macos
            command: flutter build macos --debug
          - runner: windows-latest
            target: windows
            command: flutter build windows --debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Flutter example (${{ matrix.target }})
          phase: start

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            packages/ui_flutter/example/android/**/*.gradle*
            packages/ui_flutter/example/android/gradle/wrapper/gradle-wrapper.properties

      # This step measured 87s against a 14s build. Most of that is the
      # recommended-package fan-out behind libgtk-3-dev, which the Flutter
      # Linux toolchain does not need.
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build example
        working-directory: packages/ui_flutter/example
        run: ${{ matrix.command }}

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Flutter example (${{ matrix.target }})
          phase: finish

  flutter_preview:
    name: Flutter preview development
    if: >-
      needs.changes.outputs.flutter_preview == 'true' ||
      needs.changes.outputs.shared == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start job metrics
        uses: ./.github/actions/job-metrics
        with:
          label: Flutter preview development
          phase: start

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Homepage dependencies
        run: pnpm --filter @tinyrack/homepage... install --frozen-lockfile

      - name: Set up Chromium
        uses: ./.github/actions/setup-playwright
        with:
          filter: "@tinyrack/homepage"
          browsers: chromium

      - name: Test Flutter preview development server
        run: pnpm --filter @tinyrack/homepage test:flutter-dev

      - name: Finish job metrics
        if: always()
        uses: ./.github/actions/job-metrics
        with:
          label: Flutter preview development
          phase: finish

  ci_gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - web_packages
      - homepage_preview
      - ui
      - ui_firefox
      - docs_contract
      - docs
      - homepage
      - flutter
      - flutter_platforms
      - flutter_preview
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify selected jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_SELECTED: >-
            ${{ needs.changes.outputs.docs == 'true' ||
                needs.changes.outputs.homepage == 'true' ||
                needs.changes.outputs.shared == 'true' }}
          WEB_RESULT: ${{ needs.web_packages.result }}
          HOMEPAGE_PREVIEW_SELECTED: >-
            ${{ needs.changes.outputs.homepage == 'true' ||
                needs.changes.outputs.shared == 'true' }}
          HOMEPAGE_PREVIEW_RESULT: ${{ needs.homepage_preview.result }}
          UI_SELECTED: ${{ needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true' }}
          UI_RESULT: ${{ needs.ui.result }}
          UI_FIREFOX_RESULT: ${{ needs.ui_firefox.result }}
          CONTRACT_SELECTED: >-
            ${{ needs.changes.outputs.docs_contract == 'true' &&
                needs.changes.outputs.ui != 'true' &&
                needs.changes.outputs.shared != 'true' }}
          CONTRACT_RESULT: ${{ needs.docs_contract.result }}
          DOCS_SELECTED: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.shared == 'true' }}
          DOCS_RESULT: ${{ needs.docs.result }}
          HOMEPAGE_SELECTED: >-
            ${{ needs.changes.outputs.homepage == 'true' ||
                needs.changes.outputs.shared == 'true' }}
          HOMEPAGE_RESULT: ${{ needs.homepage.result }}
          FLUTTER_SELECTED: >-
            ${{ needs.changes.outputs.flutter == 'true' ||
                needs.changes.outputs.shared == 'true' }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
          FLUTTER_PLATFORMS_RESULT: ${{ needs.flutter_platforms.result }}
          PREVIEW_SELECTED: >-
            ${{ needs.changes.outputs.flutter_preview == 'true' ||
                needs.changes.outputs.shared == 'true' }}
          PREVIEW_RESULT: ${{ needs.flutter_preview.result }}
        run: |
          test "$CHANGES_RESULT" = "success"

          require_success() {
            local selected="$1"
            local result="$2"
            local label="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "::error::$label was selected but finished with $result"
              exit 1
            fi
          }

          require_success "$WEB_SELECTED" "$WEB_RESULT" "Build Web packages"
          require_success "$HOMEPAGE_PREVIEW_SELECTED" "$HOMEPAGE_PREVIEW_RESULT" "Build Homepage Flutter preview"
          require_success "$UI_SELECTED" "$UI_RESULT" "UI Chromium and contracts"
          require_success "$UI_SELECTED" "$UI_FIREFOX_RESULT" "UI Firefox"
          require_success "$CONTRACT_SELECTED" "$CONTRACT_RESULT" "UI documentation contracts"
          require_success "$DOCS_SELECTED" "$DOCS_RESULT" "Docs package"
          require_success "$HOMEPAGE_SELECTED" "$HOMEPAGE_RESULT" "Homepage package"
          require_success "$FLUTTER_SELECTED" "$FLUTTER_RESULT" "Flutter package"
          require_success "$FLUTTER_SELECTED" "$FLUTTER_PLATFORMS_RESULT" "Flutter platforms"
          require_success "$PREVIEW_SELECTED" "$PREVIEW_RESULT" "Flutter preview development"

  deploy_homepage:
    name: Deploy homepage
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.homepage == 'true' &&
      needs.ci_gate.result == 'success' &&
      needs.homepage.result == 'success'
    needs:
      - changes
      - homepage
      - ci_gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install Homepage deployment dependencies
        run: pnpm --filter @tinyrack/homepage... install --frozen-lockfile

      - name: Download Homepage artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: homepage-client
          path: packages/homepage/build/client

      - name: Deploy Homepage to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run docs:deploy
