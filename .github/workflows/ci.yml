name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare package outputs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace formatting
        run: pnpm run biome

      - name: Verify generated design tokens
        run: |
          pnpm run tokens:check
          pnpm run flutter:preview:check

      - name: Build packages in dependency order
        env:
          TINYRACK_DOCS_PRERENDER_WORKERS: "1"
        run: pnpm run build

      - name: Test Flutter preview development server
        run: |
          pnpm --filter @tinyrack/homepage exec playwright install --with-deps chromium
          pnpm --filter @tinyrack/homepage test:flutter-dev

      - name: Pack prepared UI dependency
        run: |
          mkdir -p .tmp/prebuilt
          pnpm --config.ignore-scripts=true --dir packages/ui pack --pack-destination "$GITHUB_WORKSPACE/.tmp/prebuilt"

      - name: Upload prepared outputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prepared-workspace
          path: |
            .tmp/prebuilt
            packages/ui/dist
            packages/docs/dist
            packages/homepage/build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  flutter:
    name: Flutter package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Resolve package dependencies
        working-directory: packages/tinyrack_ui
        run: flutter pub get

      - name: Analyze and test package
        working-directory: packages/tinyrack_ui
        run: |
          dart format --output=none --set-exit-if-changed lib test example/lib
          flutter analyze
          flutter test

      - name: Validate the public package archive
        working-directory: packages/tinyrack_ui
        run: dart pub publish --dry-run

  flutter-platforms:
    name: Flutter example (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: android
            command: flutter build apk --debug
          - runner: ubuntu-latest
            target: linux
            command: flutter build linux --debug
          - runner: macos-latest
            target: ios
            command: flutter build ios --simulator --no-codesign
          - runner: macos-latest
            target: macos
            command: flutter build macos --debug
          - runner: windows-latest
            target: windows
            command: flutter build windows --debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Build example
        working-directory: packages/tinyrack_ui/example
        run: ${{ matrix.command }}

  ui:
    name: UI package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared outputs
        uses: actions/download-artifact@v8.0.1
        with:
          name: prepared-workspace
          path: .

      - name: Install browser engines
        run: pnpm --filter @tinyrack/ui exec playwright install --with-deps chromium firefox

      - name: Test UI unit and Chromium suites
        run: |
          pnpm --filter @tinyrack/ui test:unit
          pnpm --filter @tinyrack/ui test:chromium

      - name: Test UI Firefox suite
        id: ui-firefox-test
        continue-on-error: true
        run: pnpm --filter @tinyrack/ui test:firefox

      - name: Retry UI Firefox suite for diagnostics
        if: steps.ui-firefox-test.outcome == 'failure'
        run: pnpm --filter @tinyrack/ui test:firefox

      - name: Preserve the first UI Firefox failure
        if: steps.ui-firefox-test.outcome == 'failure'
        run: exit 1

  docs:
    name: Docs package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared outputs
        uses: actions/download-artifact@v8.0.1
        with:
          name: prepared-workspace
          path: .

      - name: Test docs package
        run: |
          export TINYRACK_UI_TARBALL="$(realpath .tmp/prebuilt/*.tgz)"
          pnpm --filter @tinyrack/docs test:prepared

  homepage:
    name: Homepage package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared outputs
        uses: actions/download-artifact@v8.0.1
        with:
          name: prepared-workspace
          path: .

      - name: Install Chromium
        run: pnpm --filter @tinyrack/homepage exec playwright install --with-deps chromium

      - name: Test homepage package
        run: pnpm --filter @tinyrack/homepage test:prepared

      - name: Upload homepage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: homepage-client
          path: packages/homepage/build/client
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy-homepage:
    name: Deploy homepage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ui
      - docs
      - flutter
      - flutter-platforms
      - homepage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up JavaScript runtime
        uses: ./.github/actions/setup-js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download homepage artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: homepage-client
          path: packages/homepage/build/client

      - name: Deploy homepage to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run docs:deploy
