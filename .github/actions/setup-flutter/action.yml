name: Set up Flutter
description: >-
  Install the pinned Flutter SDK and restore the pub package cache. Every job
  that needs Flutter goes through here so the SDK version cannot drift between
  the preview build, the package verification, and the platform matrix.

inputs:
  flutter-version:
    description: Flutter SDK version to install.
    required: false
    default: 3.47.0

runs:
  using: composite
  steps:
    - name: Set up the Flutter SDK
      uses: subosito/flutter-action@v2.23.0
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Restore the pub package cache
      uses: actions/cache@v6.1.0
      with:
        path: ~/.pub-cache
        key: >-
          pub-${{ runner.os }}-${{ inputs.flutter-version }}-${{
            hashFiles('packages/ui_flutter/pubspec.yaml',
                      'packages/ui_flutter/example/pubspec.yaml') }}
        restore-keys: |
          pub-${{ runner.os }}-${{ inputs.flutter-version }}-
          pub-${{ runner.os }}-
