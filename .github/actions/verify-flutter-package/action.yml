name: Verify Flutter package
description: >-
  Set up Flutter and run the tinyrack_ui format, analyze, test, and publish
  archive checks. Shared by pull request CI and the pub.dev publish workflow so
  both gates stay identical.

inputs:
  flutter-version:
    description: Flutter SDK version to install.
    required: false
    default: 3.47.0
  working-directory:
    description: Directory containing the Flutter package to verify.
    required: false
    default: packages/ui_flutter

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: ./.github/actions/setup-flutter
      with:
        flutter-version: ${{ inputs.flutter-version }}

    - name: Resolve package dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get

    - name: Check package formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart format --output=none --set-exit-if-changed lib test example/lib

    - name: Analyze, test, and validate the package archive in parallel
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        analyze_status=0
        test_status=0
        publish_status=0

        flutter analyze &
        analyze_pid=$!
        flutter test &
        test_pid=$!
        dart pub publish --dry-run &
        publish_pid=$!

        wait "$analyze_pid" || analyze_status=$?
        wait "$test_pid" || test_status=$?
        wait "$publish_pid" || publish_status=$?

        if (( analyze_status != 0 || test_status != 0 || publish_status != 0 )); then
          echo "::error::Flutter verification failed (analyze=$analyze_status test=$test_status publish=$publish_status)"
          exit 1
        fi
