name: Verify Flutter package
description: >-
  Set up Flutter and run the tinyrack_ui format, analyze, and test checks. Full
  mode also validates the publish archive and analyzer compatibility consumer.

inputs:
  mode:
    description: Run fast PR checks or the complete merge and release checks.
    required: false
    default: full
  flutter-version:
    description: Flutter SDK version to install.
    required: false
    default: 3.47.0
  working-directory:
    description: Directory containing the Flutter package to verify.
    required: false
    default: packages/ui_flutter

runs:
  using: composite
  steps:
    - name: Validate verification mode
      shell: bash
      env:
        VERIFICATION_MODE: ${{ inputs.mode }}
      run: |
        if [[ "$VERIFICATION_MODE" != "fast" && "$VERIFICATION_MODE" != "full" ]]; then
          echo "::error::Unknown Flutter verification mode: $VERIFICATION_MODE"
          exit 2
        fi

    - name: Set up Flutter
      uses: ./.github/actions/setup-flutter
      with:
        flutter-version: ${{ inputs.flutter-version }}

    - name: Resolve package dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get

    - name: Check package formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart format --output=none --set-exit-if-changed lib test example/lib

    - name: Analyze and test the package in parallel
      if: inputs.mode == 'fast'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        analyze_status=0
        test_status=0

        flutter analyze &
        analyze_pid=$!
        flutter test &
        test_pid=$!

        wait "$analyze_pid" || analyze_status=$?
        wait "$test_pid" || test_status=$?

        if (( analyze_status != 0 || test_status != 0 )); then
          echo "::error::Fast Flutter verification failed (analyze=$analyze_status test=$test_status)"
          exit 1
        fi

    - name: Analyze, test, and validate the package archive in parallel
      if: inputs.mode == 'full'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        analyze_status=0
        test_status=0
        publish_status=0

        flutter analyze &
        analyze_pid=$!
        flutter test &
        test_pid=$!
        dart pub publish --dry-run &
        publish_pid=$!

        wait "$analyze_pid" || analyze_status=$?
        wait "$test_pid" || test_status=$?
        wait "$publish_pid" || publish_status=$?

        if (( analyze_status != 0 || test_status != 0 || publish_status != 0 )); then
          echo "::error::Flutter verification failed (analyze=$analyze_status test=$test_status publish=$publish_status)"
          exit 1
        fi

    - name: Verify the analyzer 12 consumer
      if: inputs.mode == 'full'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/test/analyzer_12_consumer
      run: |
        flutter pub get
        dart run tinyrack_ui:tinyrack_ui_check --root .
